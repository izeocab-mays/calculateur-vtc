<svg viewBox="0 0 520 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration d'une voiture VTC sur une route, avec des indicateurs de revenu net">
  <!-- Route -->
  <rect x="0" y="150" width="520" height="50" fill="#f0f2f5"/>
  <line x1="0" y1="150" x2="520" y2="150" stroke="#cbd1d8" stroke-width="2"/>
  <line x1="0" y1="170" x2="520" y2="170" stroke="#e2e6ea" stroke-width="2" stroke-dasharray="14 10"/>

  <!-- Voiture berline stylisée -->
  <g>
    <path d="M72 150 Q72 118 96 110 L132 102 Q172 86 212 88 L252 96 Q302 100 342 112 L382 122 Q407 129 417 150 Z" fill="#0a1628"/>
    <path d="M140 102 Q172 88 206 90 L252 97 L252 118 L140 118 Z" fill="#e8c56d" opacity="0.92"/>
    <path d="M258 98 Q288 93 314 101 L314 118 L258 118 Z" fill="#e8c56d" opacity="0.92"/>
    <line x1="96" y1="122" x2="382" y2="122" stroke="#132038" stroke-width="2"/>
    <rect x="162" y="108" width="15" height="3.5" rx="1.75" fill="#c8963e"/>
    <rect x="288" y="108" width="15" height="3.5" rx="1.75" fill="#c8963e"/>
    <path d="M408 133 L420 133 Q424 133 424 137 L424 141 L408 143 Z" fill="#e8c56d"/>
    <path d="M82 133 L94 133 Q96 133 96 136 L96 139 L82 141 Z" fill="#c8963e"/>
    <circle cx="150" cy="148" r="20" fill="#111827"/>
    <circle cx="150" cy="148" r="9" fill="#c8963e"/>
    <circle cx="330" cy="148" r="20" fill="#111827"/>
    <circle cx="330" cy="148" r="9" fill="#c8963e"/>
  </g>

  <!-- Indicateurs de données -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <rect x="18" y="26" width="96" height="40" rx="8" fill="#fff" stroke="#e2e6ea"/>
    <text x="32" y="52" font-size="20" font-weight="700" fill="#c8963e">€ net</text>
    <rect x="420" y="34" width="84" height="36" rx="8" fill="#fff" stroke="#e2e6ea"/>
    <text x="430" y="57" font-size="18" font-weight="700" fill="#0a1628">▲ 21%</text>
  </g>
</svg>
